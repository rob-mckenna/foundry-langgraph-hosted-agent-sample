[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-langgraph-hosted-agent-sample"
version = "0.1.0"
description = "Claims status inquiry agent demo shared between standalone FastAPI and Microsoft Foundry hosting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2.60,<1.1",
  "langchain-core>=0.3.40,<1.0",
  "langchain-openai>=0.2.10,<1.0",
  "langchain-azure-ai>=0.1.2,<1.0",
  "agent-framework-foundry-hosting>=1.0.0a260528,<2.0",
  "azure-ai-projects>=1.0.0b8,<2.0",
  "azure-identity>=1.20,<2.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
