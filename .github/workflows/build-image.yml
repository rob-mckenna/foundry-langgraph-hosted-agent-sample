name: Build Images

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'deployment/**/Dockerfile'

permissions:
  contents: read
  id-token: write

env:
  STANDALONE_IMAGE_NAME: claims-standalone-api
  FOUNDRY_IMAGE_NAME: claims-foundry-agent

jobs:
  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          echo "ACR_LOGIN_SERVER=$(az acr show --name "${ACR_NAME}" --query loginServer --output tsv)" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: az acr login --name "${ACR_NAME}"

      - name: Build and push standalone image
        run: |
          docker build \
            -f deployment/standalone/Dockerfile \
            -t "${ACR_LOGIN_SERVER}/${STANDALONE_IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${ACR_LOGIN_SERVER}/${STANDALONE_IMAGE_NAME}:latest" \
            .
          docker push "${ACR_LOGIN_SERVER}/${STANDALONE_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${ACR_LOGIN_SERVER}/${STANDALONE_IMAGE_NAME}:latest"

      - name: Build and push Microsoft Foundry image
        run: |
          # Production containers use DefaultAzureCredential with managed identity at runtime.
          # This workflow only publishes images to ACR by using GitHub OIDC for Azure auth.
          docker build \
            -f deployment/foundry/Dockerfile \
            -t "${ACR_LOGIN_SERVER}/${FOUNDRY_IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${ACR_LOGIN_SERVER}/${FOUNDRY_IMAGE_NAME}:latest" \
            .
          docker push "${ACR_LOGIN_SERVER}/${FOUNDRY_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${ACR_LOGIN_SERVER}/${FOUNDRY_IMAGE_NAME}:latest"
