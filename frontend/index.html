<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claims Processing Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Healthcare claims demo</p>
          <h1>Claims Processing Assistant</h1>
          <p class="subtitle">
            Ask about claim status, member eligibility, or plan benefits using the standalone API.
          </p>
        </div>
        <div class="session-card" aria-live="polite">
          <span class="session-label">Session thread</span>
          <code id="threadIdLabel" class="session-value"></code>
        </div>
      </header>

      <main class="chat-panel">
        <section id="messages" class="messages" aria-label="Conversation" aria-live="polite"></section>

        <section class="composer-panel">
          <div class="prompt-row">
            <span class="prompt-label">Try asking</span>
            <div id="suggestions" class="suggestions" aria-label="Suggested prompts"></div>
          </div>

          <form id="chatForm" class="composer" novalidate>
            <label for="messageInput" class="sr-only">Type your message</label>
            <input
              id="messageInput"
              name="message"
              type="text"
              placeholder="Ask about a claim, member, or plan..."
              autocomplete="off"
              maxlength="500"
              required
            />
            <button id="sendButton" type="submit">Send</button>
          </form>

          <div id="status" class="status" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
