name: foundry-langgraph-hosted-agent-sample
metadata:
  template: foundry-langgraph-hosted-agent-sample
infra:
  provider: bicep
  path: infra/bicep
hooks:
  postprovision:
    shell: sh
    run: scripts/create-foundry-project.sh
services:
  claims-foundry-agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: deployment/foundry/Dockerfile
