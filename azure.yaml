name: foundry-langgraph-hosted-agent-sample
metadata:
  template: foundry-langgraph-hosted-agent-sample
infra:
  provider: bicep
  path: infra/bicep
hooks:
  predeploy:
    - run: scripts/clean-env.sh
      shell: posix
    - run: scripts/clean-env.ps1
      shell: windows
services:
  # 1) Standalone — LangGraph on Container Apps, Azure OpenAI direct (no Foundry)
  claims-standalone-agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: deployment/standalone/Dockerfile
  # 2) ACA-hosted — LangGraph on Container Apps, calls models via Foundry project
  claims-aca-agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: deployment/aca-hosted/Dockerfile
  # 3) Foundry Hosted Agent — deployed to Foundry Agent Service
  claims-foundry-agent:
    project: .
    host: azure.ai.agent
    language: docker
    docker:
      path: deployment/aca-hosted/Dockerfile
      remoteBuild: false
    config:
      container:
        resources:
          cpu: "1"
          memory: 2Gi
        startupCommand: python -m aca_hosted.app
