name: foundry-langgraph-hosted-agent-sample
metadata:
  template: foundry-langgraph-hosted-agent-sample
infra:
  provider: bicep
  path: infra/bicep
services:
  # 1) Standalone — LangGraph on Container Apps, Azure OpenAI direct (no Foundry)
  claims-standalone-agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: deployment/standalone/Dockerfile
  # 2) ACA-hosted — LangGraph on Container Apps, calls models via Foundry project
  claims-aca-agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: deployment/aca-hosted/Dockerfile
